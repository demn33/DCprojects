<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Among Blocklist</title>
  <link rel="stylesheet" href="stage4.css">
</head>
<body>

  <!-- Top Bar with Title and Admin Login -->
  <header class="top-bar">
    <h1>Test Blocklist</h1>

    <!-- Admin Login Section (Top Right) -->
    <div id="loginSection" class="login-box">
      <input type="password" id="adminPassword" placeholder="Admin Password">
      <button onclick="adminLogin()">Login</button>
    </div>

    <!-- Admin Logout Section -->
    <div id="logoutSection" class="logout-box" style="display:none;">
      <span><strong>Blacklist Manager</strong></span>
      <button class="clear" onclick="adminLogout()">Logout</button>
      <button class="clear" onclick="clearAll()">Clear All</button>
      <input type="file" id="csvInput" accept=".csv" style="display:none;">
      <!-- <button onclick="document.getElementById('csvInput').click()">Import CSV</button>
      <button onclick="exportCSV()">Export CSV</button> -->
    </div>
  </header>

  <!-- Search -->
  <div class="search-box">
    <label for="searchInput">Search by Friend Code or AU Name:</label>
    <input type="text" id="searchInput" placeholder="Enter Friend Code">
  </div>

<!-- Form -->
<form id="blocklistForm">
  <label>AU NAME:</label>
  <input type="text" id="auName" required>

  <label>FRIENDCODE:</label>
  <input type="text" id="friendCode" required>

  <label>INFRACTION:</label>
  <input type="text" id="infraction" required>

  <label>REASON:</label>
  <textarea id="reason" required></textarea>

  <!-- Parole (hidden for non-admins) -->
  <div id="paroleContainer" class="admin-only">
    <label>Parole:</label>
    <input type="text" id="parole">
  </div>

  <button type="submit">Add to Blocklist</button>
</form>


  <!-- Table -->
  <table id="blocklistTable">
    <thead>
      <tr>
        <th>AU NAME</th>
        <th>FRIENDCODE</th>
        <!-- <th>BL</th> -->
        <th>INFRACTION</th>
        <th>REASON</th>
        <th>PAROLE</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="stage4.js"></script>
</body>
</html>
